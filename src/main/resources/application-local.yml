server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 5s

  sql:
    init:
      mode: never

  jackson:
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 10MB

  cors:
    allowed-methods: ${ALLOWED_METHODS}
    allowed-origins: ${ALLOWED_ORIGINS}

  datasource:
    url: jdbc:mysql://localhost:3306/mate-local-db
    username: mate-local-user
    password: mate-local-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

    mongodb:
      uri: mongodb://root:root@mongo7:27017/mate-dev-db?authSource=admin
      database: mate-dev-db
      auto-index-creation: true
      authentication-database: admin

  config:
    import: optional:file:.env[.properties]

  cookie:
    maxage: 2592000
    path: /
    samesite: Lax
    domain: localhost
    secure: true
    http-only: true

  security:
    oauth2:
      success-redirect: ${KAKAO_SUCCESS_REDIRECT}
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
            scope:
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

logging:
  level:
    org.hibernate.SQL: debug

security:
  jwt:
    secret-key: ${JWT_SECRET}
    access-expired: 604800000 # 7일
    refresh-expired: 2592000000 # 30일

cloud:
  aws:
    s3:
      cache-time-seconds: 2592000 # 30일
      bucket-name: ${S3_BUCKET_NAME}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      image-url: ${S3_IMAGE_URL}
      region: ${S3_REGION}
