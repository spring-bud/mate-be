version: '3'

services:
  mysql:
    image: mysql:8.3.0
    container_name: mate-mysql8
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_USER: mate-local-user
      MYSQL_PASSWORD: mate-local-password
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mate-local-db
      TZ: 'Asia/Seoul'
    volumes:
      - mate-mysqldb:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7.2.4-alpine
    container_name: redis7
    command: redis-server --port 6379
    restart: always
    hostname: root
    labels:
      - 'mode:standalone'
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mate-mysqldb:
  redis-data:

networks:
  mate:
    external: true
